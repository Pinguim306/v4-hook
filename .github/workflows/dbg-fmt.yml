# TEMPORARY diagnostic — one CI step per workflow so each step's pass/fail is visible
# from the runs API alone (the jobs/logs API is unavailable through our proxy).
# Delete once the failing step is identified.
name: dbg-fmt
on: [push, workflow_dispatch]
jobs:
  fmt:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.7.1 }
      - run: chmod +x bootstrap.sh && ./bootstrap.sh
      - run: forge fmt --check
