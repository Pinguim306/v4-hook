name: dbg-unit
on: [push, workflow_dispatch]
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.7.1 }
      - run: chmod +x bootstrap.sh && ./bootstrap.sh
      - run: forge test -vv
