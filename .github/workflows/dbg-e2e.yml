# TEMPORARY diagnostic — see dbg-fmt.yml. This one also publishes the step's output
# to the ci-debug-log branch, since the Actions logs API is unreachable from the
# session driving this investigation (git transport works fine).
name: dbg-e2e
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.7.1 }
      - run: chmod +x bootstrap.sh && ./bootstrap.sh
      - name: e2e tests (log captured)
        shell: bash
        run: |
          set -o pipefail
          FOUNDRY_PROFILE=e2e forge test --match-path "test/e2e/**" -vv 2>&1 | tee /tmp/e2e.log
      - name: Publish log to ci-debug-log branch
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "ci-debug"
          git config user.email "ci-debug@localhost"
          git checkout --orphan ci-debug-log
          git reset
          tail -c 200000 /tmp/e2e.log > e2e.log
          git add -f e2e.log
          git commit -m "dbg-e2e log for ${{ github.sha }}"
          git push -f origin ci-debug-log
