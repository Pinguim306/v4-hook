name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contracts:
    name: Contracts (forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned: forge fmt's style changes between releases, and `stable` drifting is
          # exactly what turned fmt --check red on every push. The sources are formatted
          # with this version — bump the pin and re-run `forge fmt` together.
          version: v1.7.1

      - name: Install dependencies (pinned)
        run: chmod +x bootstrap.sh && ./bootstrap.sh

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Test (unit)
        run: forge test -vv

      - name: Test (e2e — real PoolManager/POSM, upstream compiler settings)
        run: FOUNDRY_PROFILE=e2e forge test --match-path "test/e2e/**" -vv

  web:
    name: Web (vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
